<!DOCTYPE html>
<html>
<head>
<style>
body {
  background:
    linear-gradient(rgba(50,50,50,0.8), rgba(50,50,50,0.8)),
    url("https://i.pinimg.com/originals/11/cf/ee/11cfeef9eaa56c71a6eeb9933f933492.gif");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  font-family: Arial, sans-serif;
  color:#fff;
  padding:10px;
  text-align:center;
}

.glass{
  background: rgba(30,30,30,0.85);
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:12px;
  padding:12px;
}

#login{
  height:460px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

#chatScreen{ display:none; }

.chatWrap{
  max-width:900px;
  margin:30px auto;
}

.rules{
  max-width:500px;
  font-size:13px;
  margin-bottom:12px;
  text-align:left;
}

input{
  padding:10px;
  margin:5px;
  width:80%;
  max-width:400px;
  background: rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:8px;
  color:#fff;
}

button{
  padding:10px 18px;
  margin:5px;
  background: rgba(255,255,255,0.2);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:8px;
  cursor:pointer;
  color:#fff;
}

button:hover{ background: rgba(255,255,255,0.35); }

#chat{
  height:480px;
  overflow-y:auto;
  margin-bottom:15px;
  text-align:left;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.msg{
  width:fit-content;
  max-width:min(78%, 620px);
  margin:0;
  padding:9px 13px;
  font-size:15px;
  line-height:1.4;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px 16px 16px 5px;
  background:rgba(255,255,255,.045);
  box-shadow:0 3px 14px rgba(0,0,0,.14);
  overflow-wrap:anywhere;
}

.msg.mine{
  align-self:flex-end;
  border-radius:16px 16px 5px 16px;
  background:rgba(85,232,135,.13);
  border-color:rgba(85,232,135,.24);
}

.msg.mine b{
  color:var(--sw-primary) !important;
}

.msg .btn{
  margin-left:7px;
}
.msg b{
  font-size:17px;
}
.msg img{
  max-width:300px;
  max-height:300px;
  border:2px solid #fff;
  border-radius:6px;
  display:block;
  margin-top:5px;
}

.admin{ color:#ff5555; }

.btn{
  font-size:12px;
  margin-left:6px;
  cursor:pointer;
  color:#aaa;
}
.btn:hover{ color:red; }

#online{
  color:#00ff00;
  font-size:13px;
  margin-bottom:8px;
}

#adminPanel{
  display:none;
  margin-bottom:12px;
  background: rgba(50,0,0,0.6);
  border:1px solid #d88;
  border-radius:10px;
  padding:10px;
}

.adminGrid{
  display:flex;
  gap:15px;
}

.adminLeft{
  flex:2;
  text-align:left;
}

.adminRight{
  flex:1;
  background: rgba(80,80,80,0.5);
  border-radius:8px;
  padding:8px;
  font-size:12px;
  text-align:left;
}

.adminRight b{
  display:block;
  margin-bottom:6px;
}

#logs{
  display:none;
  font-size:12px;
  max-height:150px;
  overflow-y:auto;
  margin-top:8px;
}

#commandsLog{
  display:block;
  font-size:12px;
  max-height:100px;
  overflow-y:auto;
  margin-bottom:6px;
  color:#0ff;
}

#sendBar{
  display:flex;
  justify-content:center;
  gap:8px;
  align-items:center;
  position:relative;
  padding-top:4px;
}

#sendBar input[type=text]{
  height:42px;
  border-radius:999px;
  padding:0 16px;
}

#sendBar button{
  height:42px;
}

#sendBar > button:last-of-type{
  border-radius:999px;
  padding:0 18px;
  background:rgba(85,232,135,.12);
  border-color:rgba(85,232,135,.3);
}

#gifPicker{
  position:absolute;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  width:380px;
  max-height:260px;
  overflow-y:auto;
  background:rgba(20,20,20,0.98);
  border:2px solid rgba(255,255,255,0.3);
  border-radius:12px;
  padding:12px;
  display:none;
  z-index:999;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}

#colorOptions{
  position:absolute;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  width:380px;
  max-height:260px;
  overflow-y:auto;
  background:rgba(20,20,20,0.98);
  border:2px solid rgba(255,255,255,0.3);
  border-radius:12px;
  padding:12px;
  display:none;
  z-index:999;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}

.gifGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.gifGrid img{
  width:100%;
  cursor:pointer;
  border-radius:8px;
  border:2px solid #555;
  transition:all 0.2s ease;
}

.gifGrid img:hover{
  border-color:#888;
  transform:scale(1.05);
}

.colorGrid {
  display: grid;
  grid-template-columns: repeat(6, 1fr); /* 6 colors per row */
  gap: 8px;
}

.colorGrid div {
  width: 40px;
  height: 40px;
  border-radius: 6px;
  cursor: pointer;
  border: 2px solid #555;
  transition: transform 0.15s, border-color 0.15s;
}

.colorGrid div:hover {
  transform: scale(1.1);
  border-color: #fff;
}


#gifBtn {
  padding:10px;
  font-size:20px;
  background: rgba(255,255,255,0.2);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:6px;
  cursor:pointer;
  color:#fff;
}
#gifBtn:hover { background: rgba(255,255,255,0.35); }

#colorBtn {
  padding:10px;
  font-size:20px;
  background: rgba(255,255,255,0.2);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:6px;
  cursor:pointer;
  color:#fff;
}
#colorBtn:hover { background: rgba(255,255,255,0.35); }

#sendBar input[type=text]{
  width:50%;
  max-width:520px;
}

.footer{
  margin-top:15px;
  font-size:12px;
  color:#ccc;
}

.backBtn{
  font-size:12px;
  background: rgba(255,255,255,0.2);
}

/* Shake animation */
@keyframes shake {
  0% { transform: translateX(0px); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
  100% { transform: translateX(0px); }
}

.shake {
  animation: shake 0.5s;
}

.gifDivider{
  grid-column: 1 / -1;
  margin: 10px 0;
  padding-top: 6px;
  border-top: 1px solid rgba(255,255,255,0.3);
  font-size: 11px;
  color: #ff7777;
  text-align: center;
  letter-spacing: 1px;
}

.roomCard{
  padding:8px 14px;
  background: rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:8px;
  cursor:pointer;
  color:#fff;
  font-size:12px;
  transition:all 0.2s ease;
}

.roomCard:hover{
  background: rgba(255,255,255,0.15);
  border-color: rgba(255,255,255,0.4);
}

.roomCard.active{
  background: rgba(100,200,255,0.3);
  border-color: rgba(100,200,255,0.8);
  color:#6cf;
}

.roomCard small{
  display:block;
  font-size:10px;
  color:#aaa;
  margin-top:3px;
}

.statusText{
  font-size:12px;
  color:#888;
  margin-left:5px;
}

.checkboxUser{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  background: rgba(255,255,255,0.08);
  border-radius:6px;
  cursor:pointer;
}

.checkboxUser input{
  width:auto;
  cursor:pointer;
  margin:0;
  padding:0;
}

.checkboxUser span{
  font-size:13px;
}

.checkboxUser:hover{
  background: rgba(255,255,255,0.15);
}



/* Compact chat layout: keep the message scroller and composer inside one viewport. */
.chatWrap{
  height:calc(100vh - 28px);
  max-height:calc(100vh - 28px);
  margin:2px auto;
  padding:10px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.chatTopBar{flex:0 0 auto}
#chatScreen > div[style*="margin-bottom:15px"]{
  margin-bottom:5px !important;
  flex:0 0 auto;
}
#chatScreen > div[style*="margin-bottom:15px"] > b{
  font-size:11px !important;
}
#publicRooms,#privateRooms{
  gap:4px !important;
  margin-top:4px !important;
  max-height:38px;
  overflow-y:auto;
}
.roomCard{
  padding:5px 9px !important;
  font-size:11px !important;
}
.roomCard small{display:none !important}
#privateModal{flex:0 0 auto}
#adminPanel{flex:0 0 auto;max-height:150px;overflow:auto}
#chat{
  flex:1 1 auto;
  width:100%;
  height:auto !important;
  min-height:0 !important;
  max-height:none !important;
  margin:5px 0 !important;
  overflow-y:auto;
}
#sendBar{
  flex:0 0 auto;
  width:100%;
  min-height:42px;
  padding:0 !important;
}
#sendBar input[type=text]{
  height:38px !important;
}
#sendBar button{
  height:38px !important;
  margin:2px !important;
}
.footer{display:none}
@media(max-width:700px){
  .chatWrap{
    height:calc(100vh - 12px);
    max-height:calc(100vh - 12px);
    padding:7px;
  }
  .chatTopBar{padding-bottom:5px;margin-bottom:5px}
  #publicRooms,#privateRooms{max-height:34px}
  #chat{margin:4px 0 !important}
  #sendBar input[type=text]{font-size:14px}
}

/* Snoopy Web theme bridge: keep the original chat structure/functionality,
   but use the same dark glass + green glow language as the hub. */
:root{
  --sw-bg:#0f1217;
  --sw-panel:rgba(24,28,34,.72);
  --sw-panel-strong:rgba(20,24,30,.88);
  --sw-border:rgba(255,255,255,.12);
  --sw-primary:#55e887;
  --sw-primary-soft:rgba(85,232,135,.16);
  --sw-muted:#8f98a3;
}
body{
  background:
    radial-gradient(ellipse at top,rgba(38,54,46,.38),transparent 52%),
    radial-gradient(ellipse at bottom,rgba(12,18,15,.72),transparent 58%),
    #0f1217;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#f2f5f3;
  padding:16px;
  min-height:100vh;
  box-sizing:border-box;
}
*,*:before,*:after{box-sizing:border-box}
.glass{
  background:linear-gradient(135deg,var(--sw-panel),rgba(20,24,30,.42));
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--sw-border);
  border-radius:16px;
  box-shadow:0 8px 32px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.04);
}
#login{min-height:460px;height:auto;padding:32px 22px}
.chatWrap{max-width:1100px;margin:4px auto;padding:12px}
.chatTopBar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:0 2px 8px;
  border-bottom:1px solid rgba(255,255,255,.07);
  margin-bottom:8px;
}
.chatTitle{font-size:18px;font-weight:700;letter-spacing:-.02em}
#currentRoomLabel{font-size:12px;color:var(--sw-muted);margin-top:3px}
.chatTopActions{display:flex;align-items:center;gap:10px}
.backBtn{margin:0;font-size:12px;padding:8px 12px}

input{
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.12);
  outline:none;
  transition:.2s;
}
input:focus{border-color:rgba(85,232,135,.55);box-shadow:0 0 0 3px rgba(85,232,135,.08)}
button{
  background:rgba(255,255,255,.065);
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  transition:.2s ease;
}
button:hover{background:rgba(85,232,135,.12);border-color:rgba(85,232,135,.38);box-shadow:0 0 18px rgba(85,232,135,.09)}
#chat{
  background:rgba(8,11,14,.38);
  border-color:rgba(255,255,255,.08);
  scrollbar-color:#30373f transparent;
  height:calc(100vh - 250px);
  min-height:320px;
  max-height:620px;
  margin-bottom:8px;
}
#online{color:var(--sw-primary);margin:0}
#chatScreen{min-height:0}
.chatTitle{font-size:16px}
.chatTopActions{gap:6px}
.chatTopActions .backBtn{padding:6px 9px}
#chatScreen > div[style*="margin-bottom:15px"]{margin-bottom:8px !important}
#chatScreen > div[style*="margin-bottom:15px"] + div[style*="margin-bottom:15px"]{margin-bottom:8px !important}
#privateModal{margin-bottom:8px !important;padding:10px !important}
#adminPanel{background:rgba(80,20,25,.28);border-color:rgba(255,100,110,.35)}
.adminRight{background:rgba(255,255,255,.035)}
#gifPicker,#colorOptions{background:rgba(13,16,20,.96);border-color:rgba(85,232,135,.25)}
.roomCard.active{background:var(--sw-primary-soft);border-color:rgba(85,232,135,.55);color:var(--sw-primary);box-shadow:0 0 18px rgba(85,232,135,.08)}
.roomCard:hover{background:rgba(255,255,255,.075)}
#gifBtn,#colorBtn{background:rgba(255,255,255,.065)}
#sendBar input[type=text]{background:transparent;border-color:rgba(255,255,255,.1)}
.footer{color:var(--sw-muted)}
h1{letter-spacing:-.02em}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#30373f;border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:#4a545e}
@media(max-width:700px){
  body{padding:6px}
  .chatWrap{margin:2px auto;padding:10px}
  .chatTopBar{align-items:flex-start}
  .chatTopActions{flex-direction:column;align-items:flex-end;gap:6px}
  .msg{max-width:88%}
  #chatScreen{padding:8px}
  #chat{height:calc(100vh - 285px);min-height:260px}
  #sendBar{gap:4px;padding-top:0}
#sendBar input[type=text]{height:38px}
#sendBar button{height:38px;padding-top:7px;padding-bottom:7px}
  #sendBar input[type=text]{width:auto;min-width:0;flex:1}
  #gifPicker,#colorOptions{width:min(94vw,380px)}
}



/* ===== Compact admin/chat redesign ===== */
.chatWrap{
  width:min(1180px, calc(100vw - 28px));
  max-width:1180px;
  height:calc(100vh - 34px);
  max-height:none;
  margin:0 auto;
  padding:12px;
  gap:0;
}
.chatTopBar{
  min-height:42px;
  padding:0 2px 7px;
  margin-bottom:7px;
}
.chatTitle{font-size:15px;font-weight:750}
#currentRoomLabel{font-size:11px}
#online{
  padding:5px 9px;
  border:1px solid rgba(85,232,135,.18);
  background:rgba(85,232,135,.06);
  border-radius:999px;
  font-size:11px;
}
.chatTopActions{gap:6px}
.chatTopActions .backBtn{padding:5px 9px;font-size:11px}
#chatScreen > div[style*="margin-bottom:15px"]{
  margin-bottom:5px !important;
}
#chatScreen > div[style*="margin-bottom:15px"] > b{
  display:block;

}
#publicRooms{

  gap:4px !important;
  margin-top:0 !important;
  padding:1px;
  overflow:visible !important;
  max-height:none !important;
}
#privateRooms{
  display:flex !important;
  flex-direction:column !important;
  gap:3px !important;
  margin-top:0 !important;
  padding:1px;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  max-height:180px;
}
.roomCard{
  flex:0 0 auto;

.roomCard small{display:none !important}
#privateRooms > div{flex:0 0 auto}
#privateRooms > div .roomCard{max-width:230px;overflow:hidden;text-overflow:ellipsis}
#chatScreen > div:nth-of-type(2) > div:last-child{margin-top:4px !important}
#chatScreen > div:nth-of-type(2) > div:last-child button{
  padding:5px 9px !important;
  margin:0 !important;
  font-size:10px !important;
}
#privateModal{
  margin:5px 0 7px !important;
  padding:9px !important;

  overflow:auto;
}
#privateModal > b{font-size:12px}
#privateModal small{font-size:10px !important}
.checkboxUser{padding:5px 8px}
.checkboxUser span{font-size:11px}
#adminPanel{
  margin:5px 0 7px !important;
  padding:7px !important;
  border-radius:11px;
  background:linear-gradient(135deg,rgba(80,20,25,.28),rgba(40,18,22,.18));

  overflow:auto;
}
.adminHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:5px;
}
.adminTitle{
  display:flex;
  align-items:center;

  font-size:11px;

  letter-spacing:.05em;
  text-transform:uppercase;
}
.adminDot{width:7px;height:7px;border-radius:50%;background:#ff6975;box-shadow:0 0 9px rgba(255,80,95,.6)}
.adminRole{
  padding:2px 5px;
  border-radius:5px;
  font-size:8px;
  background:rgba(255,100,110,.12);
  color:#ff9aa2;
  border:1px solid rgba(255,100,110,.2);
}
.adminHeaderHint{font-size:9px;color:#8f98a3}
.adminToolbar{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:5px;
}
.adminAction{
  margin:0 !important;
  padding:5px 8px !important;
  font-size:10px !important;
  line-height:1.1;
  border-radius:7px !important;
  white-space:nowrap;
}
.adminAction.danger{border-color:rgba(255,100,110,.25);background:rgba(255,80,90,.06)}
.commandHelp{
  position:relative;
  margin:0;
  font-size:10px;
}
.commandHelp summary{
  list-style:none;

  padding:5px 8px;

  border-radius:7px;
  background:rgba(255,255,255,.05);

}
.commandHelp summary::-webkit-details-marker{display:none}
.commandList{
  position:absolute;
  z-index:30;
  top:calc(100% + 5px);
  right:0;
  width:min(470px,80vw);
  padding:7px;
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  background:rgba(13,16,20,.98);
  border:1px solid rgba(255,255,255,.12);
  border-radius:9px;
  box-shadow:0 12px 30px rgba(0,0,0,.45);
}
.commandList code{
  padding:4px 6px;
  border-radius:5px;
  background:rgba(255,255,255,.055);
  color:#c9d2da;
  font-size:9px;
}
.adminToolsRow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.adminToolGroup{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:4px;align-items:center;padding:6px;border:1px solid rgba(255,255,255,.08);border-radius:7px;background:rgba(0,0,0,.12)}
.adminToolGroup label{grid-column:1/-1;font-size:8px;color:#9aa2aa;text-transform:uppercase;letter-spacing:.06em}
.adminToolGroup select{min-width:0;height:26px;padding:0 6px;border-radius:6px;border:1px solid rgba(255,255,255,.12);background:#17191d;color:#eee;font-size:9px}
.adminToolGroup .adminAction{height:26px;padding:0 7px!important}

  border-radius:13px 13px 13px 5px;
}
.msg b{font-size:13px}
.msg img{max-width:240px;max-height:240px}
.btn{font-size:9px;margin-left:5px}
#sendBar{

/* =========================================================
   SNOOPY'S CHAT — CLEAN REDESIGN
   Flat midnight UI, compact navigation, reliable chat scrolling.
   ========================================================= */
:root{
  --bg:#090b10;
  --panel:#11141b;
  --panel2:#151922;
  --panel3:#1a1f2a;
  --line:#252b36;
  --line2:#303744;
  --text:#eef1f6;
  --muted:#8e97a6;
  --accent:#7c8cff;
  --accent2:#63d7ff;
  --green:#55d98b;
  --red:#ff6878;
}

html,body{width:100%;height:100%;margin:0}
body{
  padding:14px;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 0%,rgba(124,140,255,.09),transparent 30%),
    radial-gradient(circle at 100% 100%,rgba(99,215,255,.055),transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-align:left;
}
*,*:before,*:after{box-sizing:border-box}

/* Login */
#login{
  width:min(430px,calc(100vw - 28px));
  min-height:0;
  height:auto;
  margin:10vh auto 0;
  padding:30px;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:center;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 24px 70px rgba(0,0,0,.45);
}
#login h1{margin:0 0 5px;font-size:24px;text-align:center;letter-spacing:-.03em}
#login h3{margin:0 0 18px;font-size:12px;font-weight:500;color:var(--muted);text-align:center}
.rules{
  max-width:none;
  margin:0 0 14px;
  padding:12px 14px;
  font-size:11px;
  line-height:1.55;
  background:#0d1016;
  border:1px solid var(--line);
  border-radius:11px;
  color:#aeb6c3;
}
.rules b{color:var(--text)}
#login input{
  width:100%;
  max-width:none;
  height:42px;
  margin:4px 0;
  padding:0 12px;
  background:#0d1016;
  border:1px solid var(--line2);
  border-radius:10px;
  color:var(--text);
}
#login input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,140,255,.1);outline:none}
#login > button{
  width:100%;
  height:42px;
  margin:9px 0 0;
  background:var(--accent);
  border:0;
  border-radius:10px;
  color:#fff;
  font-weight:700;
}
#login > button:hover{background:#8998ff;box-shadow:none}

/* Main app shell */
#chatScreen{
  display:none;
  width:100%;
  height:calc(100vh - 28px);
  min-height:0;
  margin:0;
  padding:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--panel);
  box-shadow:0 22px 70px rgba(0,0,0,.42);
  grid-template-columns:235px minmax(0,1fr);
}
.chatSidebar{
  min-width:0;
  min-height:0;
  padding:14px 10px;
  display:flex;
  flex-direction:column;
  background:#0e1117;
