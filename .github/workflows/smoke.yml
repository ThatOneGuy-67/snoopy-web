name: Smoke test deployed site

on:
  workflow_run:
    workflows: ["Deploy Vite site to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      site_url:
        description: "Base URL to test (defaults to the Pages URL)"
        required: false

permissions:
  contents: read
  pages: read
  id-token: write

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve site URL
        id: site
        run: |
          URL="${{ github.event.inputs.site_url }}"
          if [ -z "$URL" ]; then
            URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          fi
          URL="${URL%/}/"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Testing $URL"

      - name: Install Playwright
        run: |
          npm i -D playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Run smoke test
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
        run: node scripts/smoke-test.mjs
