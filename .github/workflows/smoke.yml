name: Smoke test deployed site

# Optional post-deploy check. Skipped automatically when the deploy workflow
# didn't run (e.g. a fork that hasn't enabled GitHub Pages).

on:
  workflow_run:
    workflows: ["Deploy Vite site to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      site_url:
        description: "Base URL to test (defaults to this repository's Pages URL)"
        required: false

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve site URL
        id: site
        env:
          INPUT_URL: ${{ github.event.inputs.site_url }}
          VAR_URL: ${{ vars.VITE_SITE_URL }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          URL="${INPUT_URL:-$VAR_URL}"
          if [ -z "$URL" ]; then
            OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
            if [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "$OWNER_LC.github.io" ]; then
              URL="https://$OWNER_LC.github.io"
            else
              URL="https://$OWNER_LC.github.io/$REPO"
            fi
          fi
          URL="${URL%/}/"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Testing $URL"

      - name: Install Playwright
        run: |
          npm i -D playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Run smoke test
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
          ASSET_ORIGIN: ${{ vars.VITE_ASSET_ORIGIN }}
        run: node scripts/smoke-test.mjs
