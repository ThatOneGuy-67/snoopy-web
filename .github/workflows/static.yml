name: Deploy Vite site to GitHub Pages

# Deployment is optional and fully self-contained: the base path and public
# URL are derived from the repository this workflow runs in, so a fork needs
# no edits. Enable Pages (Settings -> Pages -> Source: GitHub Actions) to use it.
#
# Optional repository *variables* (Settings -> Secrets and variables ->
# Actions -> Variables) override anything that needs your own backend:
#   VITE_BASE_PATH, VITE_SITE_URL, VITE_SUPABASE_URL,
#   VITE_SUPABASE_PUBLISHABLE_KEY, VITE_FIREBASE_*, VITE_WISP_URL,
#   VITE_ASSET_ORIGIN, VITE_MUSIC_CDN

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        # Inject the staff passwords into the original Snoopy's Chat HTML.
        # Prefer GitHub Secrets; repository Variables also work as a fallback.
        env:
          SNOOPY_ADMIN_PASSWORD: ${{ secrets.CUP || vars.CUP }}
          SNOOPY_MOD_PASSWORD: ${{ secrets.LOSER || vars.LOSER }}
          SNOOPY_OWNER_PASSWORD: ${{ secrets.ALPHA || vars.ALPHA }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_WISP_URL: ${{ vars.VITE_WISP_URL }}
          VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL }}
          VITE_ASSET_ORIGIN: ${{ vars.VITE_ASSET_ORIGIN }}
          VITE_MUSIC_CDN: ${{ vars.VITE_MUSIC_CDN }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("public/chat.html")
          s = p.read_text()
          replacements = {
              "__SNOOPY_ADMIN_PASSWORD__": os.environ.get("SNOOPY_ADMIN_PASSWORD", ""),
              "__SNOOPY_MOD_PASSWORD__": os.environ.get("SNOOPY_MOD_PASSWORD", ""),
              "__SNOOPY_OWNER_PASSWORD__": os.environ.get("SNOOPY_OWNER_PASSWORD", ""),
          }
          for old, new in replacements.items():
              s = s.replace(old, new.replace("\\", "\\\\").replace('"', '\\"'))
          p.write_text(s)
          PY
          npm run build

      - name: SPA fallback for client-side routes
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
